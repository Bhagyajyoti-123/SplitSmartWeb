services:
  - type: web
    name: splitsmart
    runtime: java
    buildCommand: mvn clean package -DskipTests
    startCommand: java -Dspring.profiles.active=prod -jar target/splitsmart-1.0.0.jar
    envVars:
      - key: GEMINI_API_KEY
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: splitsmart-db
          property: connectionString

databases:
  - name: splitsmart-db
    databaseName: splitsmart
    plan: free
